<script>
  const navbar_brand = document.querySelector('.navbar-brand');

navbar_brand.textContent = "";
navbar_brand.href = "http://localhost:7001/";


const shift_prev = document.querySelector('.shift-prev');
const shift_next = document.querySelector('.shift-next');
const parent = document.querySelector('.shelf');
const gparent = document.querySelector('.main-activity');

console.log(parent);

const ul = document.createElement('ul');
const li = document.createElement('li');

const bookwidth = 240;

let j = 0;
let isDown = false;
let scrollLeft;
let stertX;

ul.classList.add("list");


for (let i = 0; i < 5; i++) {
  li.classList.add(i);
  ul.appendChild(li.cloneNode(1));
}
gparent.appendChild(ul);

parent.scrollLeft = 2 * bookwidth;


parent.addEventListener('mousedown', (e) => {
  isDown = true;
  stertX = e.clientX - parent.offsetLeft;
  scrollLeft = parent.scrollLeft;
});

parent.addEventListener('mouseleave', (e) => {
  isDown = false;
  let ps = parent.scrollLeft;
  parent.scrollLeft = Math.round(ps / bookwidth) * bookwidth;
  if (ps < 2 * bookwidth)
    parent.scrollLeft += 5 * bookwidth;
  if (ps > 7 * bookwidth)
    parent.scrollLeft -= 5 * bookwidth;
  ulChange();
});

parent.addEventListener('mouseup', (e) => {
  isDown = false;
  let ps = parent.scrollLeft;
  parent.scrollLeft = Math.round(ps / bookwidth) * bookwidth;
  if (ps < 2 * bookwidth)
    parent.scrollLeft += 5 * bookwidth;
  if (ps > 7 * bookwidth)
    parent.scrollLeft -= 5 * bookwidth;
  ulChange();
});

parent.addEventListener('mousemove', (e) => {
  if (!isDown)
    return;
  const x = scrollLeft - (e.clientX - parent.offsetLeft - stertX);
  parent.scrollLeft = x;
});

shift_prev.addEventListener('click', () => {
  let ps = parent.scrollLeft;
  ps -= bookwidth;
  if (ps < 2 * bookwidth)
    ps += 5 * bookwidth;
  if (ps > 7 * bookwidth)
    ps -= 5 * bookwidth;
  parent.scrollLeft = ps;
  ulChange();
});

shift_next.addEventListener('click', () => {
  let ps = parent.scrollLeft;
  ps += bookwidth;
  if (ps < 2 * bookwidth)
    ps += 5 * bookwidth;
  if (ps > 7 * bookwidth)
    ps -= 5 * bookwidth;
  parent.scrollLeft = ps;
  ulChange();
});

function ulChange() {
  j = 0;
  ul.childNodes.forEach(l => {
    if (j === (parent.scrollLeft / bookwidth + 1) % 5)
      l.classList.add('active');
    else if (l.classList.contains('active'))
      l.classList.remove('active');
    j++;
  });
}

ulChange();
  </script>
